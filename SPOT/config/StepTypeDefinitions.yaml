    Runbook:
        Type:   # reference to the parent property, which is the type of the runbook step (e.g. PowershellFunctionLocal)
            _Mandatory: True
            _Type: string
        Disabled:   # marks the step runbook to be skipped during runbook execution
            _Mandatory: False
            _Type: string
        ContinueOnError:    # sets if the step should determine the entire (parent)runbook to stop in case of error. if not set, the default behavior is False
            _Mandatory: False
            _Type: string
        Description:    # description of the step
            _Mandatory: False
            _Type: string
        Conditions:  # the conditions to be evalued to decide if the step is executed or skipped
            _Mandatory: False
            _Type: string[]            
        Seq:    # the sequence number in which the steps are to be executed; if the same sequence number is used multiple times, those steps are executed in parallel
            _Mandatory: True
            _Type: int
        RemoteParameters: # the parameters needed for the runbook to be executed remotely
            _Mandatory: False
            _Type: hashtable
            ExecFunction:  # if the runbook should be executed from a remote computer, this parameter sets the remote function to be used; default value is PowershellCommandLocal
                _Mandatory: False
                _Type: string
            RemoteComputer: # the hostname or IP of the remote computer on which the script shall be executed
                _Mandatory: False
                _Type: string
            Credential: # the credential to be used to connect to the remote computer
                _Mandatory: False
                _Type: System.Management.Automation.PSCredential